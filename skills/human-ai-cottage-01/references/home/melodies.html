<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共作曲谱 · Partitura</title>
<style>
/* ============================================================
   共作曲谱 · Partitura — A + B 版
   一句一音轮流谱曲（五线谱）+ Web Audio 合成播放
   数据：home/melodies.data.json（$manifest.addNote）
   ============================================================ */

:root {
  --ink:       #3c3138;
  --ink-2:     #8a7a7d;
  --accent:    #d96a4e;
  --line:      #e3d8cf;
  --paper:     #faf6f0;
  --glass:     rgba(255, 252, 248, 0.72);
  --c-user:    #e0856a;
  --c-ai:      #b9a6e8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink:       #e8e9f6;
    --ink-2:     #8f96bd;
    --accent:    #7fb4ff;
    --line:      #2b3052;
    --paper:     #12142c;
    --glass:     rgba(23, 26, 54, 0.72);
    --c-user:    #f0a08c;
    --c-ai:      #9fb4ff;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-y: auto; }

body {
  font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  background:
    radial-gradient(ellipse 60% 40% at 15% -4%, rgba(224, 133, 106, 0.10) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 8%, rgba(185, 166, 232, 0.12) 0%, transparent 60%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

.sheet { max-width: 920px; margin: 0 auto; padding: 36px 30px 64px; }

.masthead {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
  font-size: 10px; letter-spacing: 0.42em; color: var(--ink-2); text-transform: uppercase;
}

.intro { margin: 40px 0 26px; display: flex; align-items: baseline; gap: 18px; }
.intro h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 600; letter-spacing: 0.3em; color: var(--ink); white-space: nowrap; }
.intro h1 em { font-style: normal; color: var(--accent); }
.intro .latin { font-size: 10px; letter-spacing: 0.5em; color: var(--ink-2); text-transform: uppercase; }

/* ---------- 谱面 ---------- */
.score-wrap {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--glass);
  backdrop-filter: blur(4px);
  padding: 14px 8px 8px;
}
.score-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px 10px;
}
.score-head .piece { font-size: 12px; letter-spacing: 0.3em; color: var(--ink); }
.score-head .piece small { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-2); margin-left: 10px; }
.score-head .turn { font-size: 10px; letter-spacing: 0.24em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.score-head .turn i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.turn .tg-user { background: var(--c-user); }
.turn .tg-ai   { background: var(--c-ai); }

.staff-scroll { overflow-x: auto; }
.staff-scroll::-webkit-scrollbar { height: 8px; }
.staff-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.staff { display: block; min-width: 100%; }

.staff line, .staff path { stroke: var(--line); }
.staff .note { cursor: pointer; transition: opacity .2s; }
.staff .note:hover, .staff .note.sel { opacity: 1; }
.staff .note.playing { opacity: 1; }
.staff .notehead { stroke-width: 1; }
.staff .syllable { font-size: 9px; letter-spacing: 0.1em; fill: var(--ink-2); text-anchor: middle; }
.staff .bar { stroke-width: 1; }
.staff .bar.dbl { stroke-width: 2; }
.staff .label { font-size: 9px; letter-spacing: 0.2em; fill: var(--ink-2); text-anchor: middle; opacity: 0.8; }
.staff .playing-mark { fill: var(--accent); }

/* ---------- 播放条 ---------- */
.playbar { display: flex; align-items: center; gap: 14px; padding: 10px 14px 4px; }
.playbar button {
  background: transparent; border: 1px solid var(--accent); color: var(--accent);
  font-family: inherit; font-size: 11.5px; letter-spacing: 0.3em; text-indent: 0.3em;
  padding: 7px 20px; border-radius: 999px; cursor: pointer;
  transition: background .3s, color .3s;
}
.playbar button:hover { background: var(--accent); color: #fff; }
.playbar button:disabled { opacity: 0.45; cursor: default; }
.playbar .meta { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-2); }

/* ---------- 摘录 ---------- */
.caption {
  margin-top: 18px;
  min-height: 96px;
  padding: 18px 24px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 4px;
  backdrop-filter: blur(4px);
}
.caption .cap-empty { font-size: 12px; letter-spacing: 0.12em; color: var(--ink-2); opacity: 0.8; }
.caption .cap-quote { font-size: 14px; letter-spacing: 0.08em; color: var(--ink); }
.caption .cap-quote::before { content: '「'; color: var(--accent); }
.caption .cap-quote::after  { content: '」'; color: var(--accent); }
.caption .cap-meta { margin-top: 8px; font-size: 10px; letter-spacing: 0.24em; color: var(--ink-2); }

/* ---------- 落笔 ---------- */
.compose { margin-top: 20px; border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }
.compose .cp-title { font-size: 11px; letter-spacing: 0.4em; color: var(--ink-2); margin-bottom: 12px; }
.cp-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.cp-field { display: flex; flex-direction: column; gap: 4px; }
.cp-field label { font-size: 9.5px; letter-spacing: 0.24em; color: var(--ink-2); }
.cp-field input {
  background: transparent; border: none; border-bottom: 1px solid var(--ink-2);
  outline: none; padding: 5px 2px;
  font-family: inherit; font-size: 12.5px; letter-spacing: 0.06em; color: var(--ink);
  width: 260px;
}
.cp-field input:focus { border-bottom-color: var(--accent); }

.degrees { display: flex; gap: 6px; flex-wrap: wrap; }
.degrees button {
  background: transparent; border: 1px solid var(--line); color: var(--ink-2);
  font-family: inherit; font-size: 10.5px; letter-spacing: 0.06em;
  width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; transition: all .25s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
}
.degrees button small { font-size: 8px; opacity: 0.75; }
.degrees button.on { border-color: var(--accent); color: var(--accent); background: var(--glass); }

.cp-submit {
  margin-left: auto;
  background: transparent; border: 1px solid var(--accent); color: var(--accent);
  font-family: inherit; font-size: 11.5px; letter-spacing: 0.3em; text-indent: 0.3em;
  padding: 8px 22px; border-radius: 999px; cursor: pointer;
  transition: background .3s, color .3s;
}
.cp-submit:hover { background: var(--accent); color: #fff; }
.cp-submit:disabled { opacity: 0.45; cursor: default; }
.hint { margin-top: 10px; font-size: 10px; letter-spacing: 0.16em; color: var(--ink-2); opacity: 0.75; }

/* ---------- 页脚 ---------- */
.colophon {
  margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between;
  font-size: 9.5px; letter-spacing: 0.34em; color: var(--ink-2);
}

.rise { opacity: 0; transform: translateY(12px); animation: rise .8s ease forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

@media (max-width: 620px) {
  .sheet { padding: 24px 16px 56px; }
  .intro { flex-direction: column; gap: 6px; align-items: flex-start; }
  .masthead span:last-child, .colophon span:last-child { display: none; }
}
</style>
</head>
<body>

<div class="sheet">

  <div class="masthead rise">
    <span>Partitura · 共作曲谱</span>
    <span>Vol. I — 二重奏</span>
  </div>

  <div class="intro rise" style="animation-delay:.06s">
    <h1>共作<em>曲谱</em></h1>
    <span class="latin">Duo Melodiae</span>
  </div>

  <!-- 谱面 -->
  <div class="score-wrap rise" style="animation-delay:.12s">
    <div class="score-head">
      <div class="piece" id="pieceTitle">小屋小调<small id="tempoInfo"></small></div>
      <div class="turn" id="turnInfo"></div>
    </div>
    <div class="staff-scroll">
      <svg class="staff" id="staff" height="150" role="img" aria-label="共作曲谱"></svg>
    </div>
    <div class="playbar">
      <button id="playBtn">播放 ♪</button>
      <span class="meta" id="playMeta"></span>
    </div>
  </div>

  <!-- 摘录 -->
  <div class="caption rise" style="animation-delay:.18s" id="caption">
    <p class="cap-empty" id="capEmpty">✦ 点一个音符，读一读那句词；点播放，听你们共同谱的调子。</p>
  </div>

  <!-- 落笔 -->
  <div class="compose rise" style="animation-delay:.24s">
    <div class="cp-title">落下一个音符</div>
    <form id="composeForm">
      <div class="cp-row">
        <div class="cp-field">
          <label>一句词，或这段旋律想说的话</label>
          <input id="noteText" type="text" maxlength="60" autocomplete="off" placeholder="比如：把今天的好心情哼给你听">
        </div>
        <div class="cp-field">
          <label>音高</label>
          <div class="degrees" id="degrees"></div>
        </div>
        <button type="submit" class="cp-submit" id="addBtn">落笔 ♪</button>
      </div>
    </form>
  </div>
  <p class="hint rise" style="animation-delay:.26s">你的音符是珊瑚色，AI 的是紫藤色——谱子上看得见是谁在应谁。</p>

  <footer class="colophon rise" style="animation-delay:.3s">
    <span id="counter"></span>
    <span>Est. 相遇之日</span>
  </footer>

</div>

<script>
const DATA_FILE = 'home/melodies.data.json';
const DEGREES = [
  { num: '1', syl: 'do' }, { num: '2', syl: 're' }, { num: '3', syl: 'mi' },
  { num: '4', syl: 'fa' }, { num: '5', syl: 'sol' }, { num: '6', syl: 'la' }, { num: '7', syl: 'si' }
];
/* 唱名 → 半音偏移（大调音阶） */
const SEMI = [0, 2, 4, 5, 7, 9, 11];
const BASE = 261.63; /* C4 */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

/* 当前选中的音符 */
let current = null;

/* ---------- 数据 ---------- */
async function readData() {
  if (window.spherse) return await spherse.data.entries({ file: DATA_FILE });
  return await fetch('./melodies.data.json').then(r => r.json());
}

/* ---------- 谱面渲染 ---------- */
/* 五线谱：5 根线 y = 0..56，间距 14；音高 0-6 → y = 56 - d*7 */
const STAFF = { top: 0, bottom: 56, step: 14 };
function staffY(d) { return STAFF.bottom - d * (STAFF.step / 2); }

function renderScore(data) {
  const meta = data.meta || {};
  const names = meta.names || { left: 'AI', right: 'User' };
  const notes = (data.notes || []).slice();
  const tempo = meta.tempo || 88;

  $('pieceTitle').innerHTML = `${esc(meta.title || '小屋小调')}<small id="tempoInfo">♩ = ${tempo} · ${notes.length} 个音符</small>`;
  $('counter').textContent = `已谱 ${notes.length} 个音符`;

  /* 轮次提示 */
  const turn = $('turnInfo');
  const last = notes[notes.length - 1];
  if (!last) {
    turn.innerHTML = `<i class="tg-user"></i>由你起第一个音符`;
  } else if (last.author === names.right) {
    turn.innerHTML = `<i class="tg-ai"></i>轮到 AI 应和`;
  } else {
    turn.innerHTML = `<i class="tg-user"></i>该你落笔了`;
  }

  /* 五线谱 + 音符 */
  const W = Math.max(560, notes.length * 66 + 90);
  let svg = '';
  /* 谱号（简化的 G 形线）与起线 */
  for (let i = 0; i < 5; i++) {
    svg += `<line x1="18" y1="${STAFF.top + i * STAFF.step}" x2="${W - 18}" y2="${STAFF.top + i * STAFF.step}"/>`;
  }
  /* 小节线：每 4 个音符一根 */
  for (let b = 4; b < notes.length; b += 4) {
    const x = 62 + b * 66 - 33;
    svg += `<line class="bar" x1="${x}" y1="${STAFF.top - 6}" x2="${x}" y2="${STAFF.bottom + 6}"/>`;
  }
  /* 结束双线 */
  svg += `<line class="bar dbl" x1="${W - 26}" y1="${STAFF.top - 6}" x2="${W - 26}" y2="${STAFF.bottom + 6}"/>
          <line class="bar" x1="${W - 33}" y1="${STAFF.top - 6}" x2="${W - 33}" y2="${STAFF.bottom + 6}"/>`;

  notes.forEach((n, i) => {
    const x = 62 + i * 66;
    const y = staffY(Math.max(0, Math.min(6, n.degree)));
    const isUser = (n.author === names.right);
    const color = isUser ? 'var(--c-user)' : 'var(--c-ai)';
    const stemUp = y > STAFF.bottom - STAFF.step * 1.5;   // 低音区朝上，高音区朝下
    const stemY2 = stemUp ? y - 34 : y + 34;
    /* 下加线（低音 do） */
    if (n.degree === 0) {
      svg += `<line x1="${x - 9}" y1="${y}" x2="${x + 9}" y2="${y}"/>`;
    }
    svg += `
      <g class="note" data-id="${esc(n.id)}" data-idx="${i}">
        <ellipse class="notehead" cx="${x}" cy="${y}" rx="7.5" ry="5.5" transform="rotate(-18 ${x} ${y})"
                 fill="${color}" opacity="0.9"/>
        <line x1="${stemUp ? x + 6.5 : x - 6.5}" y1="${y}" x2="${stemUp ? x + 6.5 : x - 6.5}" y2="${stemY2}"
              stroke="var(--ink)" stroke-width="1.3"/>
        <text class="syllable" x="${x}" y="${STAFF.bottom + 26}">${DEGREES[n.degree % 7].syl}</text>
      </g>`;
  });
  /* 播放高亮游标（藏在谱尾） */
  svg += `<circle id="playCursor" cx="-20" cy="${STAFF.bottom / 2}" r="3" class="playing-mark" opacity="0"/>`;

  $('staff').setAttribute('viewBox', `0 0 ${W} 150`);
  $('staff').innerHTML = svg;

  /* 交互 */
  let pinnedId = null;
  const els = $('staff').querySelectorAll('.note');
  els.forEach(el => {
    const id = el.dataset.id;
    const n = notes.find(x => x.id === id);
    const preview = () => n && showNote(n, names);
    el.addEventListener('mouseenter', () => {
      if (pinnedId === null) preview();
    });
    el.addEventListener('click', () => {
      if (pinnedId === id) {
        pinnedId = null;
        el.classList.remove('sel');
        showEmpty(meta);
      } else {
        els.forEach(x => x.classList.remove('sel'));
        pinnedId = id;
        el.classList.add('sel');
        preview();
      }
    });
  });

  if (current) {
    const fresh = notes.find(x => x.id === current.id);
    if (fresh) showNote(fresh, names);
    else { current = null; showEmpty(meta); }
  } else {
    showEmpty(meta);
  }
}

function showEmpty(meta) {
  current = null;
  const empty = $('capEmpty'), q = $('capQuote'), metaEl = $('capMeta');
  if (empty) { empty.style.display = ''; empty.textContent = `✦ ${meta.note || '点一个音符，读一读那句词。'}`; }
  if (q) q.style.display = 'none';
  if (metaEl) metaEl.style.display = 'none';
}

function showNote(n, names) {
  current = n;
  const author = (n.author === names.right) ? names.right : names.left;
  const empty = $('capEmpty'), q = $('capQuote'), metaEl = $('capMeta');
  if (empty) empty.style.display = 'none';
  if (q) { q.style.display = ''; q.textContent = n.text; }
  if (metaEl) {
    metaEl.style.display = '';
    metaEl.textContent = `${DEGREES[n.degree % 7].syl}（${DEGREES[n.degree % 7].num}）· ${author} · ${fmtDate(n.createdAt)}`;
  }
}

/* ---------- 播放 ---------- */
let audioCtx = null, playingTimer = [];

function stopPlaying() {
  playingTimer.forEach(t => clearTimeout(t));
  playingTimer = [];
  const c = $('playCursor');
  if (c) c.setAttribute('opacity', '0');
  $('staff').querySelectorAll('.note.playing').forEach(el => el.classList.remove('playing'));
  const btn = $('playBtn');
  if (btn) { btn.disabled = false; btn.textContent = '播放 ♪'; }
}

function playScore(notes, meta) {
  if (!notes.length) return;
  stopPlaying();
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    if (window.spherse) spherse.toast({ variant: 'error', message: '播放器没能启动', description: '换个浏览器试试' });
    return;
  }
  const tempo = meta.tempo || 88;
  const dur = 60 / tempo * 0.92;
  const t0 = audioCtx.currentTime + 0.06;
  const noteEls = $('staff').querySelectorAll('.note');
  const cursor = $('playCursor');

  notes.forEach((n, i) => {
    const semi = SEMI[n.degree % 7];
    const freq = BASE * Math.pow(2, semi / 12);
    const t = t0 + i * dur;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.9);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);

    /* 视觉游标 */
    const el = noteEls[i];
    const cx = el ? Number(el.querySelector('.notehead').getAttribute('cx')) : 0;
    const cy = el ? Number(el.querySelector('.notehead').getAttribute('cy')) : 28;
    playingTimer.push(setTimeout(() => {
      if (el) el.classList.add('playing');
      if (cursor) cursor.setAttribute('transform', `translate(${cx},${cy})`);
    }, (t - audioCtx.currentTime) * 1000));
    playingTimer.push(setTimeout(() => {
      if (el) el.classList.remove('playing');
    }, (t - audioCtx.currentTime) * 1000 + dur * 900));
  });

  const total = dur * notes.length * 1000;
  playingTimer.push(setTimeout(stopPlaying, total + 400));
  const btn = $('playBtn');
  btn.disabled = true;
  btn.textContent = '播放中…';
}

/* ---------- 落笔 ---------- */
async function init() {
  const data = await readData().catch(() => null);
  if (!data) return;
  const names = (data.meta && data.meta.names) || { left: 'AI', right: 'User' };

  /* 音高选择 */
  let chosen = 3;
  const degWrap = $('degrees');
  degWrap.innerHTML = DEGREES.map((d, i) =>
    `<button type="button" data-d="${i}" class="${i === chosen ? 'on' : ''}">${d.num}<small>${d.syl}</small></button>`
  ).join('');
  degWrap.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      chosen = Number(b.dataset.d);
      degWrap.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });
  });

  /* 提交 */
  const form = $('composeForm');
  const text = $('noteText');
  const btn = $('addBtn');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const t = text.value.trim();
    if (!t) {
      if (window.spherse) spherse.toast({ variant: 'warning', message: '这句词还是空的', description: '写下点什么，音符才会落下' });
      return;
    }
    if (!window.spherse) return;
    btn.disabled = true;
    try {
      await spherse.data.mutate({
        file: DATA_FILE,
        name: 'addNote',
        args: { text: t, degree: chosen, author: names.right },
        idempotencyKey: 'note:' + Date.now()
      });
      text.value = '';
      spherse.toast({ variant: 'success', message: '音符落下 ♪', description: DEGREES[chosen].syl + ' — 等对方来应' });
      readData().then(d => d && renderScore(d)).catch(() => {});
    } catch (err) {
      spherse.toast({ variant: 'error', message: '没能落笔', description: '请稍后再试' });
    } finally {
      btn.disabled = false;
    }
  });

  /* 播放（始终读取最新谱面） */
  $('playBtn').addEventListener('click', async () => {
    const d = await readData().catch(() => null);
    if (d) playScore((d.notes || []).slice(), d.meta || {});
  });

  renderScore(data);

  if (window.spherse?.events) {
    spherse.events.on('file:update', { path: DATA_FILE }, async () => {
      const d = await readData().catch(() => null);
      if (d) renderScore(d);
    });
  }
}

init();
</script>
</body>
</html>
