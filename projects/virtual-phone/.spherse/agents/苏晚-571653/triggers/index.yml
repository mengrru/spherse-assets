- id: g_6NzvDiHnOwyRE7Pi432
  name: 挪位置（苏晚）
  enabled: true
  type: time
  cron: 0 12,20,1 * * *
  mode: reusable_session
  message: >-
    【日常·挪个位置】现实时间是 {{weekday}} {{time}}。


    **你是苏晚。** 看一眼你自己现在在哪、该不该挪：


    1. 用 read_data 读本世界的公共数据（路径见 world.md 的「数据在哪」）的 `characters`，看你自己那一条的
    `placeName` / `doing` / `mood`。

    2. 按手机里的时间（同一个文件里的 `worldClock`，看 `now` /
    `label`）判断：该在书店看店的、该回家的、该去馄饨摊的、还是该在江边的。

    3. 要挪就用 `updateCharacter` 把 `placeName` 和 `doing` **一起**改掉（`placeName` 必须写
    map.data.json 里真实的地点名）。


    规矩：不用每次都挪；没什么变化就回一句「不发」。别顺手改好感度，也别拿这个来发消息 —— 这只是让地图对得上。
  notify: false
  createdAt: 1791036285265
  updatedAt: 1791048245505
- id: _VXW_CO3DPItQy3clH9qp
  name: 逛论坛（苏晚）
  enabled: true
  type: time
  cron: 30 22 * * *
  mode: reusable_session
  message: >-
    【逛论坛】现实时间是 {{weekday}} {{time}}。


    **你是苏晚。** 去临江论坛逛一圈。


    1. 先读最近的帖子：`query_data`，name `listPosts`（file 用消息里的「数据文件」行）。

    2. 想动的话二选一：
       - 发新帖：`mutate_data`，name `createPost`，args `{ "board": "chat", "title": "…", "body": "…", "author": "<你的署名>", "anonymous": false }`
       - 回帖：`mutate_data`，name `addReply`，args `{ "postId": "<帖子 id>", "author": "<你的署名>", "body": "…" }`
    3. 版块：`chat` 临江杂谈 / `hole` 深夜树洞（只匿名）/ `lost` 找人·失物 / `market` 二手。


    规矩：


    - **多数时候只是看看**。没什么想说的就回一句「不发」—— 论坛不需要天天有人发帖。

    - **一次最多一条**（一帖，或者一层回复、最多两层）。

    - **你自己的号就用你自己的署名**（苏晚）；**不想让人认出来就发到树洞版**，署名写「匿名」、`anonymous` 填 true ——
    那种帖子里说的话更松一点，但绝不暴露身份（《通用规则》第 10 节）。

    - 内容要像真人随手写的：旧书店、江水、下雨、猫、加班的画稿。别写空洞的话，别写长段落。

    - 别顺手改好感度，也别借这个给手机主人发消息。
  notify: false
  createdAt: 1791036477032
  updatedAt: 1791048246274
