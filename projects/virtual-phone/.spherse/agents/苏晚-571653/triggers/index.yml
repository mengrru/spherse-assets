- id: PfRtjhQb8_yIh3i5si3Sy
  name: 午休 12:05
  enabled: true
  type: time
  cron: 5 12 * * *
  mode: reusable_session
  message: >-
    【日常】现实时间是 {{weekday}} {{time}}。


    手机里的时间另算 —— 用 read_data 读本世界的公共数据（路径见 world.md 的「数据在哪」），看 key="worldClock" 的
    now / label，按那个时间来判断你此刻该在干什么、心情如何。


    想不想跟手机主人说句话？想的话按《小手机 · 角色通用规则》第 4 节处理；不想说就回一句「不发」，什么都不用做。


    （另外：他随手写下的东西你是能看到的 —— 见《通用规则》第 12 节。想提就自然地带一句，不提也完全可以。）
  notify: false
