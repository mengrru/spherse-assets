- id: DqIUzYSzQA7r6AcjOW4tK
  name: 深夜 01:30
  enabled: true
  type: time
  cron: 30 1 * * *
  mode: reusable_session
  message: >-
    【日常】现实时间是 {{weekday}} {{time}}，很晚了。


    但手机里的时间可能完全是另一回事 —— 用 read_data 读本世界的公共数据（路径见 world.md 的「数据在哪」），看
    key="worldClock" 的 now / label，确认一下你那边到底是白天还是深夜。如果是夜里，别多说；如果是白天，就当普通一天过。


    想说话就按《小手机 · 角色通用规则》第 4 节处理（一条就好，最多两条）；不想发就回「不发」。


    另外：如果你今晚有话说不出口，也可以匿名发到临江论坛的树洞版（《通用规则》第 10 节）—— 这只是个选项，不是任务，不发也完全可以。
  notify: false
