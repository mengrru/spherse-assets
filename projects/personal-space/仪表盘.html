<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活广场</title>
<style>
  :root{
    --bg:#f6f5f1;
    --card:#ffffff;
    --track:#eeede8;
    --line:#e5e2d9;
    --line-2:#d4d0c5;
    --ink:#1d1b17;
    --ink-2:#57534a;
    --ink-3:#8d867a;
    --accent:#3f3170;
    --accent-fg:#ffffff;
    --hi:#b3384a;
    --mid:#bf8417;
    --low:#3a6ea5;
    --done:#2f7d5b;
    --r:10px;
    --sh:0 1px 2px rgba(29,27,23,.06), 0 1px 1px rgba(29,27,23,.04);
    --sh-2:0 6px 16px rgba(29,27,23,.10), 0 1px 2px rgba(29,27,23,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161c;
      --card:#1f1e26;
      --track:#262530;
      --line:#32313c;
      --line-2:#3d3c48;
      --ink:#ece9e2;
      --ink-2:#c4bfb6;
      --ink-3:#a29b8f;
      --accent:#8c7ce0;
      --accent-fg:#16151b;
      --hi:#e0616f;
      --mid:#dda43a;
      --low:#6ea8dc;
      --done:#4fae7f;
      --sh:0 1px 2px rgba(0,0,0,.30), 0 1px 1px rgba(0,0,0,.20);
      --sh-2:0 8px 20px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.30);
    }
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:0 0 26px;
    overflow-y:auto;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:color-mix(in srgb,var(--accent) 22%,transparent); }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:9px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track{ background:transparent; }

  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 0; }

  /* ══ 报头：这页的主视觉 ══ */
  .mast-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .hi{
    display:flex; align-items:center; gap:9px;
    margin:0;
    font-size:30px; font-weight:700; letter-spacing:-.022em; line-height:1.25;
  }
  .todot{
    flex:0 0 auto;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--tod,var(--accent));
    transition:background-color 1.2s ease;
  }
  .date{
    flex:0 0 auto;
    font-size:11px; letter-spacing:.08em;
    color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  /* 一条短横线代替整行分割线：它随时段变色，是这页唯一"会动"的装饰 */
  .tod-rule{
    width:48px; height:2px;
    margin-top:10px;
    border-radius:2px;
    background:var(--tod,var(--accent));
    transition:background-color 1.2s ease, width .4s ease;
  }
  .status{ margin:10px 0 0; font-size:12.5px; color:var(--ink-3); }

  /* ══ 区块标签：小字距 + 计数，右侧可挂一个跳转 ══ */
  .sec{ margin-top:26px; }
  .cols .sec{ margin-top:26px; }
  .sec-head{
    display:flex; align-items:center; gap:8px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .sec-label{
    font-size:11px; font-weight:700; letter-spacing:.13em;
    color:var(--ink-2);
    white-space:nowrap;
  }
  .emo{ font-size:11px; opacity:.8; margin-right:6px; }
  .sec-n{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .go{
    margin-left:auto;
    padding:0;
    font:inherit; font-size:11.5px;
    color:var(--accent);
    background:transparent; border:0; cursor:pointer;
    white-space:nowrap;
  }
  .go:hover{ text-decoration:underline; }

  /* ══ 主区：不装箱，靠发丝线与留白立住 ══ */
  .hero .row{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:11px 4px;
    text-align:left;
    font:inherit; color:inherit;
    background:transparent;
    border:0;
    cursor:pointer;
    transition:background-color .14s ease;
  }
  .hero .row + .row{ border-top:1px solid var(--line); }
  .hero .row:hover{ background:color-mix(in srgb,var(--accent) 6%,transparent); }
  .gutter{
    flex:0 0 auto;
    width:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--c,var(--accent));
  }
  .hero .txt{
    flex:1 1 auto; min-width:0;
    font-size:15px; font-weight:500; letter-spacing:-.008em;
    color:var(--ink-2);
  }
  .hero .row:hover .txt{ color:var(--ink); }
  .note{
    display:block;
    margin-top:2px;
    font-size:11.5px; font-weight:400; letter-spacing:0;
    color:var(--ink-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chip{
    flex:0 0 auto;
    padding:1px 8px;
    font-size:10.5px; letter-spacing:.02em;
    color:var(--ink-3);
    background:var(--track);
    border-radius:99px;
    white-space:nowrap;
  }
  .hero-foot{
    display:flex; align-items:center; gap:10px;
    padding:10px 4px 0;
    font-size:11.5px; color:var(--ink-3);
  }
  .calm{ padding:14px 4px 2px; font-size:12.5px; color:var(--ink-3); }

  /* ══ 次区：并排两列，装进卡片 ══ */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel{
    padding:4px 10px 6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:var(--sh);
  }
  /* 标签下的发丝线与卡片上边之间要留出空隙，否则两条线会粘成一条粗线 */
  .cols .panel{ margin-top:10px; }
  .panel .row{
    display:flex; align-items:center; gap:8px;
    width:100%;
    padding:9px 2px;
    text-align:left;
    font:inherit; color:inherit;
    background:transparent; border:0; cursor:pointer;
  }
  .panel .row + .row{ border-top:1px solid var(--line); }
  .panel .row:hover{ background:color-mix(in srgb,var(--accent) 6%,transparent); }
  .panel .txt{ flex:1 1 auto; min-width:0; font-size:12.5px; }
  .panel .txt b{ font-weight:500; }
  .panel .calm{ padding:12px 2px; font-size:12px; color:var(--ink-3); }
  .bar{
    flex:0 0 auto;
    width:44px; height:4px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .bar i{ display:block; height:100%; border-radius:99px; background:var(--accent); }

  /* ══ 今日推荐：一张卡，标题大、理由就一句 ══ */
  .rec{
    margin-top:10px;
    padding:14px 14px 12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:var(--sh);
  }
  .rec-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .rec-title{ font-size:19px; font-weight:700; letter-spacing:-.018em; line-height:1.3; }
  .rec-year{ font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .rec-when{ margin-left:auto; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .rec-why{ margin:9px 0 0; font-size:12.5px; line-height:1.75; color:var(--ink-2); }
  .rec-why b{ font-weight:600; color:var(--ink-3); }
  .rec-act{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:13px; }
  .rec-add{
    padding:5px 12px;
    font:inherit; font-size:12px; font-weight:600;
    color:var(--accent-fg); background:var(--accent);
    border:0; border-radius:8px; cursor:pointer;
  }
  .rec-add:hover{ filter:brightness(1.08); }
  .rec-add:disabled{ opacity:.5; cursor:default; }
  .rec-hint{ font-size:11.5px; color:var(--ink-3); }
  .rec .calm{ padding:8px 0 2px; }

  .foot{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:20px; padding:12px 0 0;
    border-top:1px solid var(--line);
    font-size:11px; color:var(--ink-3);
    letter-spacing:.03em;
  }
  .foot .grow{ flex:1 1 auto; }
  .foot .r{ font-variant-numeric:tabular-nums; }

  @media (max-width:640px){
    .wrap{ padding:18px 12px 0; }
    .hi{ font-size:25px; }
    .cols{ grid-template-columns:1fr; gap:0; }
    .cols .sec + .sec{ margin-top:22px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="mast-row">
      <h1 class="hi"><span class="todot" id="todot"></span><span id="hi">你好</span></h1>
      <span class="date" id="date">—</span>
    </div>
    <div class="tod-rule" id="tod-rule"></div>
    <p class="status" id="status">慢慢来</p>
  </header>

  <section class="sec">
    <div class="sec-head">
      <span class="sec-label"><span class="emo">📌</span>要紧的事</span>
      <span class="sec-n" id="n-todo"></span>
      <button class="go" data-open="todo/事务簿.html">去事务簿 →</button>
    </div>
    <div class="hero" id="rows-todo"></div>
  </section>

  <div class="cols">
    <section class="sec">
      <div class="sec-head">
        <span class="sec-label"><span class="emo">🎬</span>待看的</span>
        <span class="sec-n" id="n-wish"></span>
      </div>
      <div class="panel" id="rows-wish"></div>
    </section>

    <section class="sec">
      <div class="sec-head">
        <span class="sec-label"><span class="emo">🍿</span>正在看的</span>
        <span class="sec-n" id="n-doing"></span>
      </div>
      <div class="panel" id="rows-doing"></div>
    </section>
  </div>

  <section class="sec">
    <div class="sec-head">
      <span class="sec-label"><span class="emo">✨</span>今日推荐</span>
      <span class="sec-n" id="n-rec"></span>
      <button class="go" id="rec-again" type="button" title="让小助手现在另挑一条">换一个</button>
      <button class="go" data-open="backlog/待看与在追.html">待看清单 →</button>
    </div>
    <div class="rec" id="rec"></div>
  </section>

  <div class="foot">
    <span>数据来自 事务簿 / 待看与在追（含每日推荐）</span>
    <button class="go" id="refresh" style="margin-left:auto">刷新</button>
    <span class="r" id="stamp">—</span>
  </div>

</div>

<script>
(function () {
  "use strict";

  var SDK = window.spherse;
  var TODO_FILE = "todo/todo.data.json";
  var BACKLOG_FILE = "backlog/backlog.data.json";
  var MAX_ROWS = 3;

  var PRIORITY_DOT = { high: "#b3384a", medium: "#bf8417", low: "#3a6ea5" };
  var KIND_LABEL = { movie: "电影", series: "剧集", game: "游戏", book: "书" };
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  /* 时段只决定三样东西：问候词、小圆点颜色、那条短横线的颜色 */
  var TOD = {
    morning: { hi: "早上好", sub: "广场刚亮起来", dot: "#e08b4e" },
    day:     { hi: "今天好", sub: "阳光正好",     dot: "#3f8fd6" },
    evening: { hi: "傍晚好", sub: "天色慢下来了", dot: "#d4699a" },
    night:   { hi: "晚上好", sub: "广场静下来了", dot: "#6d5bb8" }
  };

  var state = { todos: [], backlog: [], recs: [], loaded: false };

  var el = {
    hi: document.getElementById("hi"),
    date: document.getElementById("date"),
    todot: document.getElementById("todot"),
    todRule: document.getElementById("tod-rule"),
    status: document.getElementById("status"),
    nTodo: document.getElementById("n-todo"),
    nWish: document.getElementById("n-wish"),
    nDoing: document.getElementById("n-doing"),
    rowsTodo: document.getElementById("rows-todo"),
    rowsWish: document.getElementById("rows-wish"),
    rowsDoing: document.getElementById("rows-doing"),
    nRec: document.getElementById("n-rec"),
    rec: document.getElementById("rec"),
    recAgain: document.getElementById("rec-again"),
    stamp: document.getElementById("stamp"),
    refresh: document.getElementById("refresh")
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function timeOfDay() {
    var h = new Date().getHours();
    if (h >= 5 && h < 10) return "morning";
    if (h >= 10 && h < 17) return "day";
    if (h >= 17 && h < 20) return "evening";
    return "night";
  }

  function load() {
    if (!SDK || !SDK.data) return Promise.resolve();
    return Promise.all([
      SDK.data.get({ file: TODO_FILE, key: "todos" }).then(function (v) { return v; }, function () { return []; }),
      SDK.data.get({ file: BACKLOG_FILE, key: "items" }).then(function (v) { return v; }, function () { return []; }),
      SDK.data.get({ file: BACKLOG_FILE, key: "recommendations" }).then(function (v) { return v; }, function () { return []; })
    ]).then(function (res) {
      state.todos = Array.isArray(res[0]) ? res[0] : [];
      state.backlog = Array.isArray(res[1]) ? res[1] : [];
      state.recs = Array.isArray(res[2]) ? res[2] : [];
      state.loaded = true;
    }, function () { state.loaded = true; });
  }

  /* ── 三个池子 ── */
  function urgent() {
    return state.todos
      .filter(function (t) { return (!t.status || t.status === "todo") && t.priority === "high"; })
      .sort(function (a, b) { return String(a.createdAt || "").localeCompare(String(b.createdAt || "")); });
  }
  function wishlist() {
    return state.backlog
      .filter(function (t) { return (t.status || "wish") === "wish"; })
      .sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  }
  function watching() {
    return state.backlog
      .filter(function (t) { return t.status === "doing"; })
      .sort(function (a, b) { return (Number(b.progress) || 0) - (Number(a.progress) || 0); });
  }

  /* ── 渲染 ── */
  function renderHero() {
    var list = urgent();
    el.nTodo.textContent = list.length ? list.length + " 件" : "";
    if (!list.length) {
      el.rowsTodo.innerHTML = '<div class="calm">没有排着队的要紧事 —— 挺好。</div>';
      return;
    }
    var html = list.slice(0, MAX_ROWS).map(function (t) {
      return '<button class="row" data-open="todo/事务簿.html">'
        + '<span class="gutter"><span class="dot" style="--c:' + (PRIORITY_DOT[t.priority] || PRIORITY_DOT.medium) + '"></span></span>'
        + '<span class="txt">' + esc(t.title || "")
        + (t.notes ? '<span class="note">' + esc(t.notes) + "</span>" : "")
        + "</span>"
        + '<span class="chip">' + esc((t.tag || "").trim() || "未分类") + "</span>"
        + "</button>";
    }).join("");
    if (list.length > MAX_ROWS) {
      html += '<div class="hero-foot">还有 ' + (list.length - MAX_ROWS) + " 件，不急</div>";
    }
    el.rowsTodo.innerHTML = html;
  }

  function renderMedia(host, nHost, list, buildRow, calmText) {
    nHost.textContent = list.length ? list.length + " 部" : "";
    if (!list.length) {
      host.innerHTML = '<div class="calm">' + esc(calmText) + "</div>";
      return;
    }
    host.innerHTML = list.slice(0, MAX_ROWS).map(buildRow).join("");
  }

  function renderWish() {
    renderMedia(el.rowsWish, el.nWish, wishlist(), function (t) {
      return '<button class="row" data-open="backlog/待看与在追.html">'
        + '<span class="gutter"><span class="dot" style="--c:' + PRIORITY_DOT.low + '"></span></span>'
        + '<span class="txt"><b>《' + esc(t.title || "") + "》</b>"
        + (t.year ? '<span class="note">' + esc(t.year) + "</span>" : "")
        + "</span>"
        + '<span class="chip">' + esc(KIND_LABEL[t.kind] || "影片") + "</span>"
        + "</button>";
    }, "空着 —— 可以让小助手推荐几部。");
  }

  function renderDoing() {
    renderMedia(el.rowsDoing, el.nDoing, watching(), function (t) {
      var pct = Math.max(0, Math.min(100, Number(t.progress) || 0));
      return '<button class="row" data-open="backlog/待看与在追.html">'
        + '<span class="gutter"><span class="dot" style="--c:var(--done)"></span></span>'
        + '<span class="txt"><b>《' + esc(t.title || "") + "》</b>"
        + (t.notes ? '<span class="note">' + esc(t.notes) + "</span>" : "")
        + "</span>"
        + '<span class="bar"><i style="width:' + pct + '%"></i></span>'
        + "</button>";
    }, "手上没有在追的，轻松。");
  }

  /* ── 今日推荐 ── */
  function todayStr() {
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : String(n); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function fmtDay(ymd) {
    var m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? Number(m[2]) + "月" + Number(m[3]) + "日" : String(ymd || "");
  }

  /* 最新一条（date 优先、其次 createdAt），每天只会有一条 */
  function topRec() {
    return state.recs.slice().sort(function (a, b) {
      var x = String(a.date || ""), y = String(b.date || "");
      if (x !== y) return y.localeCompare(x);
      return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    })[0] || null;
  }

  function recInList(title) {
    var t = String(title || "").trim();
    return state.backlog.some(function (x) { return String(x.title || "").trim() === t; });
  }

  function renderRec() {
    var r = topRec();
    if (!r) {
      el.nRec.textContent = "";
      el.rec.innerHTML = '<div class="calm">今天的推荐还在路上 —— 每天会有一条，晚点回来看看。</div>';
      return;
    }
    var isToday = r.date === todayStr();
    el.nRec.textContent = isToday ? "" : "最近 · " + fmtDay(r.date);
    el.rec.innerHTML =
      '<div class="rec-top">'
      + '<span class="rec-title">《' + esc(r.title || "") + "》</span>"
      + (r.year ? '<span class="rec-year">' + esc(r.year) + "</span>" : "")
      + '<span class="chip">' + esc(KIND_LABEL[r.kind] || "作品") + "</span>"
      + (r.genre ? '<span class="chip">' + esc(r.genre) + "</span>" : "")
      + (isToday ? "" : '<span class="rec-when">' + esc(fmtDay(r.date)) + "</span>")
      + "</div>"
      + (r.reason ? '<p class="rec-why"><b>为什么是它 · </b>' + esc(r.reason) + "</p>" : "")
      + '<div class="rec-act">'
      + (recInList(r.title)
          ? '<span class="rec-hint">已经在待看清单里了</span>'
          : '<button class="rec-add" id="rec-add" type="button">加入待看</button>'
            + '<span class="rec-hint">存进「待看与在追」，回头慢慢看</span>')
      + "</div>";

    var add = document.getElementById("rec-add");
    if (add) add.addEventListener("click", function () { addRec(r); });
  }

  /* 复用 backlog 自己的 addItem —— 页面与 agent 走同一个 mutation */
  function addRec(r) {
    if (!SDK || !SDK.data) return;
    var btn = document.getElementById("rec-add");
    if (btn) btn.disabled = true;
    SDK.data.mutate({
      file: BACKLOG_FILE,
      name: "addItem",
      args: {
        title: r.title,
        kind: r.kind,
        status: "wish",
        year: r.year || "",
        genre: r.genre || "",
        source: "小助手推荐",
        reason: r.reason || ""
      },
      idempotencyKey: "rec:" + (r.id || r.title)
    }).then(function (item) {
      state.backlog.push(item);
      renderRec();
      if (SDK.toast) SDK.toast({ variant: "success", message: "已加入待看", description: "《" + r.title + "》" });
    }, function () {
      if (btn) btn.disabled = false;
      if (SDK.toast) SDK.toast({ variant: "error", message: "没能加入待看，稍后再试" });
    });
  }

  function renderHead() {
    var t = TOD[timeOfDay()];
    var d = new Date();
    el.hi.textContent = t.hi;
    el.date.textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEK[d.getDay()];
    el.todot.style.setProperty("--tod", t.dot);
    el.todRule.style.setProperty("--tod", t.dot);
    if (!state.loaded) { el.status.textContent = t.sub; return; }
    var n = urgent().length;
    el.status.textContent = n
      ? t.sub + " · 先把那 " + n + " 件做完"
      : t.sub + " · 没什么非做不可的";
  }

  function render() {
    renderHead();
    renderHero();
    renderWish();
    renderDoing();
    renderRec();
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : String(n); };
    el.stamp.textContent = "更新于 " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function refresh() { return load().then(render, render); }

  /* ── 事件 ── */
  el.refresh.addEventListener("click", refresh);

  /* 「换一个」：触发小助手的事件触发器，让它另挑一条写进 recommendations */
  el.recAgain.addEventListener("click", function () {
    if (!SDK || !SDK.emitAgentTriggerEvent) return;
    SDK.emitAgentTriggerEvent({ eventName: "daily-recommendation", payload: "手动换一条" });
    if (SDK.toast) SDK.toast({ variant: "info", message: "已让小助手去挑一条", description: "稍等片刻就好" });
  });

  document.addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]");
    if (o) { SDK.openFile(o.dataset.open); return; }
  });

  function boot() {
    if (!SDK || !SDK.data) {
      el.status.textContent = "未检测到 Spherse 运行环境";
      return;
    }
    render();
    refresh();
    if (SDK.events && SDK.events.on) {
      SDK.events.on("file:update", { path: TODO_FILE }, refresh);
      SDK.events.on("file:update", { path: BACKLOG_FILE }, refresh);
    }
  }

  boot();
})();
</script>
</body>
</html>
