<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收纳地图</title>
<style>
  :root{
    --bg:#f6f5f1;
    --card:#ffffff;
    --track:#eeede8;
    --line:#e5e2d9;
    --line-2:#d4d0c5;
    --ink:#1d1b17;
    --ink-2:#57534a;
    --ink-3:#8d867a;
    --accent:#3f3170;
    --accent-fg:#ffffff;
    --mark:#f6e2a8;
    --danger:#b3384a;
    --r:10px;
    --sh:0 1px 2px rgba(29,27,23,.06),0 1px 1px rgba(29,27,23,.04);
    --sh-2:0 6px 16px rgba(29,27,23,.10),0 1px 2px rgba(29,27,23,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161c;
      --card:#1f1e26;
      --track:#262530;
      --line:#32313c;
      --line-2:#3d3c48;
      --ink:#ece9e2;
      --ink-2:#c4bfb6;
      --ink-3:#a29b8f;
      --accent:#8c7ce0;
      --accent-fg:#16151b;
      --mark:#5a4a1e;
      --danger:#e0616f;
      --sh:0 1px 2px rgba(0,0,0,.3);
      --sh-2:0 8px 20px rgba(0,0,0,.4);
    }
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }

  body{
    margin:0;
    padding:0 0 26px;
    overflow-y:auto;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:color-mix(in srgb,var(--accent) 22%,transparent); }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:9px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track{ background:transparent; }

  .wrap{ max-width:860px; margin:0 auto; }

  /* ── 顶部 ── */
  .top{
    position:sticky; top:0; z-index:6;
    padding:12px 14px 10px;
    background:linear-gradient(180deg,var(--bg) 82%,color-mix(in srgb,var(--bg) 86%,transparent));
    backdrop-filter:saturate(1.1) blur(3px);
    border-bottom:1px solid var(--line);
  }
  .head-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .brand{ font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
  .stat{ font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .stat b{ color:var(--ink-2); }
  .spacer{ flex:1 1 auto; }
  .lede{ margin:6px 0 0; font-size:12px; color:var(--ink-3); }

  .btn{
    flex:0 0 auto;
    padding:6px 13px;
    font:inherit; font-size:12.5px; font-weight:600;
    color:var(--accent-fg); background:var(--accent);
    border:0; border-radius:9px; cursor:pointer;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.ghost{ color:var(--ink-2); background:var(--card); border:1px solid var(--line-2); font-weight:500; }
  .btn.ghost:hover{ border-color:var(--ink-3); color:var(--ink); }

  /* 搜索 */
  .search{
    display:flex; align-items:center; gap:8px;
    margin-top:10px; padding:5px 8px 5px 12px;
    background:var(--card);
    border:1px solid var(--line-2);
    border-radius:12px;
    box-shadow:var(--sh);
    transition:box-shadow .16s ease,border-color .16s ease;
  }
  .search:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent); }
  .search .ico{ flex:0 0 auto; font-size:14px; opacity:.55; }
  .search input{
    flex:1 1 auto; min-width:0;
    padding:8px 0;
    font:inherit; font-size:15px; color:var(--ink);
    background:transparent; border:0; outline:0;
  }
  .search input::placeholder{ color:var(--ink-3); }
  .clr{
    flex:0 0 auto; width:26px; height:26px;
    display:grid; place-items:center;
    font:inherit; font-size:13px; line-height:1;
    color:var(--ink-3); background:var(--track);
    border:0; border-radius:50%; cursor:pointer;
  }
  .clr:hover{ color:var(--ink); }

  /* 新建位置表单 */
  .newplace{
    margin-top:9px; padding:10px 11px;
    background:var(--card);
    border:1px dashed var(--line-2);
    border-radius:12px;
  }
  .newplace .line{ display:flex; gap:7px; flex-wrap:wrap; }
  .newplace input{
    flex:1 1 130px; min-width:0;
    padding:7px 10px;
    font:inherit; font-size:13px; color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line-2); border-radius:8px; outline:0;
  }
  .newplace input:focus{ border-color:var(--accent); }
  .newplace .save-row{ display:flex; gap:7px; margin-top:8px; justify-content:flex-end; }

  /* ── 区块 ── */
  .sec{ padding:14px 14px 0; }
  .room-head{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    margin:8px 0 8px;
  }
  .room-head h2{
    margin:0; font-size:12px; font-weight:700;
    letter-spacing:.1em; color:var(--ink-2);
  }
  .room-head .n{ font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:9px;
    align-items:start;
  }

  /* ── 位置卡片 ── */
  .place{
    padding:10px 11px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:var(--sh);
    transition:box-shadow .16s ease,border-color .16s ease;
  }
  .place:hover{ box-shadow:var(--sh-2); }
  .place.flash{ animation:flash 1.4s ease; }
  @keyframes flash{
    0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent); border-color:var(--accent); }
    100%{ box-shadow:0 0 0 10px rgba(0,0,0,0); }
  }
  .p-head{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .p-icon{ flex:0 0 auto; font-size:13px; }
  .p-name{
    flex:1 1 auto; min-width:0;
    font-size:13.5px; font-weight:600;
    cursor:pointer; word-break:break-word;
  }
  .p-count{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .ic{
    width:22px; height:22px; flex:0 0 auto;
    display:grid; place-items:center;
    font:inherit; font-size:11.5px; line-height:1;
    color:var(--ink-3); background:transparent;
    border:1px solid transparent; border-radius:6px; cursor:pointer;
  }
  .ic:hover{ background:var(--track); color:var(--ink); border-color:var(--line); }
  .ic.danger{ color:var(--danger); }
  .ic.danger.armed{ color:#fff; background:var(--danger); border-color:var(--danger); }
  .p-note{ margin-top:3px; font-size:11.5px; color:var(--ink-3); }

  .p-items{ margin-top:7px; border-top:1px dashed var(--line-2); padding-top:6px; }

  /* 物品行 */
  .it{
    display:flex; align-items:center; gap:6px;
    padding:3px 0;
    border-radius:6px;
  }
  .it:hover{ background:color-mix(in srgb,var(--track) 60%,transparent); }
  .it-name{ font-size:12.5px; word-break:break-word; }
  .it-qty{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .it-tag{
    padding:0 5px;
    font-size:10px;
    color:var(--ink-2);
    background:var(--track);
    border-radius:4px;
    white-space:nowrap;
  }
  .it-note{
    flex:0 1 auto; min-width:0; max-width:46%;
    font-size:11px; color:var(--ink-3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .it-actions{ display:flex; gap:2px; flex:0 0 auto; }
  .it-actions .ic{ width:20px; height:20px; font-size:11px; }

  /* 编辑物品 */
  .it-edit{ display:flex; gap:5px; flex-wrap:wrap; padding:6px 0; }
  .it-edit input,.it-edit select{
    flex:1 1 90px; min-width:0;
    padding:5px 7px;
    font:inherit; font-size:12px; color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line-2); border-radius:7px; outline:0;
  }
  .it-edit .w-name{ flex:1 1 120px; }
  .it-edit .w-qty{ flex:0 1 56px; }
  .it-edit .w-tag{ flex:0 1 90px; }
  .it-edit .w-place{ flex:1 1 140px; }
  .it-edit .save-row{ flex:1 1 100%; display:flex; gap:6px; justify-content:flex-end; }

  /* 往里放东西 */
  .addline{
    display:flex; align-items:center; gap:6px;
    margin-top:6px; padding:2px 3px;
    border-top:1px dashed var(--line-2);
  }
  .addline input{
    flex:1 1 auto; min-width:0;
    padding:6px 4px;
    font:inherit; font-size:12.5px; color:var(--ink);
    background:transparent; border:0; outline:0;
  }
  .addline input::placeholder{ color:var(--ink-3); }

  .empty{
    padding:20px 16px;
    text-align:center;
    background:var(--card);
    border:1px dashed var(--line-2);
    border-radius:var(--r);
    color:var(--ink-3);
    font-size:12.5px;
    line-height:1.85;
  }
  .empty b{ display:block; margin-bottom:4px; color:var(--ink); font-size:13px; font-weight:600; }

  /* ── 搜索结果 ── */
  .res-head{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    margin:4px 0 8px;
    font-size:12px; color:var(--ink-3);
  }
  .res{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:6px; padding:8px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
  }
  .res:hover{ border-color:var(--line-2); }
  .res .where{
    font-size:11.5px; color:var(--ink-3);
    display:inline-flex; align-items:center; gap:4px;
  }
  .res .where b{ color:var(--ink-2); font-weight:600; }
  mark{ background:var(--mark); color:inherit; border-radius:3px; padding:0 1px; }
  .gothere{
    padding:3px 9px;
    font:inherit; font-size:11.5px;
    color:var(--accent-fg); background:var(--accent);
    border:0; border-radius:7px; cursor:pointer;
  }
  .gothere:hover{ filter:brightness(1.08); }

  .foot{
    display:flex; gap:14px; flex-wrap:wrap;
    margin:18px 14px 0; padding-top:10px;
    border-top:1px solid var(--line);
    font-size:11.5px; color:var(--ink-3);
  }

  @media (max-width:640px){
    .top{ padding:10px 10px 8px; }
    .sec{ padding:12px 10px 0; }
    .foot{ margin-left:10px; margin-right:10px; }
    .grid{ grid-template-columns:1fr; }
    .search input{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="head-row">
      <span class="brand">📦 收纳地图</span>
      <span class="stat" id="stat">— </span>
      <span class="spacer"></span>
      <button class="btn ghost" id="new-place-btn">＋ 新建位置</button>
    </div>
    <p class="lede">想知道东西放哪儿了就直接搜。收纳完顺手记一笔，下次不用翻箱倒柜。</p>

    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" placeholder="搜物品、位置、房间或标签…" autocomplete="off">
      <button class="clr" id="q-clear" hidden title="清空">✕</button>
    </div>

    <div class="newplace" id="newplace" hidden>
      <div class="line">
        <input id="np-name" placeholder="位置名，如：阳台储物柜">
        <input id="np-room" list="room-list" placeholder="房间，如：阳台">
        <datalist id="room-list"></datalist>
      </div>
      <input id="np-note" placeholder="备注（可选）：里面大概装了些什么" style="margin-top:7px;width:100%">
      <div class="save-row">
        <button class="btn ghost" id="np-cancel">取消</button>
        <button class="btn" id="np-save">建好</button>
      </div>
    </div>
  </div>

  <section class="sec" id="search-sec" hidden>
    <div class="res-head" id="res-head"></div>
    <div id="results"></div>
  </section>

  <section class="sec" id="browse-sec">
    <div id="rooms"></div>
  </section>

  <div class="foot">
    <span>数据：storage/storage.data.json</span>
    <span id="foot-count">—</span>
  </div>

</div>

<script>
(function () {
  "use strict";

  var DATA_FILE = "storage/storage.data.json";
  var SDK = window.spherse;

  var state = {
    places: [],
    items: [],
    q: "",
    collapsed: {},
    editingItem: null,
    editingPlace: null,
    armed: null,
    flash: null
  };

  var timerArm = null;
  var timerFlash = null;

  var el = {
    q: document.getElementById("q"),
    qClear: document.getElementById("q-clear"),
    stat: document.getElementById("stat"),
    footCount: document.getElementById("foot-count"),
    newPlaceBtn: document.getElementById("new-place-btn"),
    newplace: document.getElementById("newplace"),
    npName: document.getElementById("np-name"),
    npRoom: document.getElementById("np-room"),
    npNote: document.getElementById("np-note"),
    npSave: document.getElementById("np-save"),
    npCancel: document.getElementById("np-cancel"),
    roomList: document.getElementById("room-list"),
    searchSec: document.getElementById("search-sec"),
    resHead: document.getElementById("res-head"),
    results: document.getElementById("results"),
    browseSec: document.getElementById("browse-sec"),
    rooms: document.getElementById("rooms")
  };

  /* ───────── 工具 ───────── */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function hi(text, q) {
    var safe = esc(text || "");
    if (!q) return safe;
    var lower = safe.toLowerCase();
    var needle = q.toLowerCase();
    var out = "";
    var i = 0;
    while (i < safe.length) {
      var at = lower.indexOf(needle, i);
      if (at < 0 || !needle) { out += safe.slice(i); break; }
      out += safe.slice(i, at) + "<mark>" + safe.slice(at, at + needle.length) + "</mark>";
      i = at + needle.length;
    }
    return out;
  }

  function toast(variant, message, description) {
    if (!SDK || !SDK.toast) return;
    try { SDK.toast({ variant: variant, message: message, description: description }); } catch (e) {}
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function uidKey() { return "storage:" + Date.now() + ":" + Math.random().toString(36).slice(2, 8); }

  function findPlace(id) {
    var hit = null;
    state.places.forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }

  function findItem(id) {
    var hit = null;
    state.items.forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }

  function itemsOf(placeId) {
    return state.items.filter(function (it) { return it.placeId === placeId; });
  }

  function rooms() {
    var map = {};
    state.places.forEach(function (p) {
      var k = (p.room || "").trim() || "未指定";
      if (!map[k]) map[k] = { name: k, places: [], count: 0 };
      map[k].places.push(p);
      map[k].count += itemsOf(p.id).length;
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, "zh"); });
  }

  /* ───────── 数据 ───────── */

  function load() {
    if (!SDK || !SDK.data) return Promise.resolve();
    return Promise.all([
      SDK.data.get({ file: DATA_FILE, key: "places" }),
      SDK.data.get({ file: DATA_FILE, key: "items" })
    ]).then(function (res) {
      state.places = Array.isArray(res[0]) ? res[0] : [];
      state.items = Array.isArray(res[1]) ? res[1] : [];
    }, function () {
      state.places = [];
      state.items = [];
    });
  }

  function mutate(name, args) {
    if (!SDK || !SDK.data) {
      toast("error", "未连接到 Spherse 数据服务", "请在 Spherse 中打开本页面");
      return Promise.reject(new Error("no_sdk"));
    }
    return SDK.data.mutate({ file: DATA_FILE, name: name, args: args, idempotencyKey: uidKey() });
  }

  function upsertPlace(p) {
    var found = false;
    state.places = state.places.map(function (x) { if (x.id === p.id) { found = true; return p; } return x; });
    if (!found) state.places.push(p);
  }

  function upsertItem(it) {
    var found = false;
    state.items = state.items.map(function (x) { if (x.id === it.id) { found = true; return it; } return x; });
    if (!found) state.items.push(it);
  }

  function refresh() {
    return load().then(render, render);
  }

  /* ───────── 渲染 ───────── */

  function renderStats() {
    var n = state.items.length;
    var r = rooms().length;
    el.stat.innerHTML = "<b>" + state.places.length + "</b> 个位置 · <b>" + n + "</b> 件物品 · <b>" + r + "</b> 个房间";
    el.footCount.textContent = "共 " + state.places.length + " 个位置 / " + n + " 件物品";
  }

  function renderRoomList() {
    el.roomList.innerHTML = rooms().map(function (r) {
      return '<option value="' + esc(r.name) + '"></option>';
    }).join("");
  }

  function itemMatches(it, q) {
    var p = findPlace(it.placeId);
    var hay = [it.name, it.tags, it.note, p && p.name, p && p.room].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function placeMatches(p, q) {
    if (p.name.toLowerCase().indexOf(q) >= 0) return true;
    if ((p.room || "").toLowerCase().indexOf(q) >= 0) return true;
    if ((p.note || "").toLowerCase().indexOf(q) >= 0) return true;
    return itemsOf(p.id).some(function (it) { return itemMatches(it, q); });
  }

  function renderSearch() {
    var q = state.q.trim().toLowerCase();
    el.searchSec.hidden = !q;
    el.browseSec.hidden = !!q;
    if (!q) { el.results.innerHTML = ""; return; }

    var hits = state.items.filter(function (it) { return itemMatches(it, q); })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "zh"); });
    var placeHits = state.places.filter(function (p) { return placeMatches(p, q); });

    if (!hits.length && !placeHits.length) {
      el.resHead.innerHTML = "<span>没有找到匹配的记录</span>";
      el.results.innerHTML = '<div class="empty"><b>“' + esc(state.q) + '”还没被记录过</b>'
        + "可能它还没入册 —— 找到之后顺手在某张位置卡片里记一笔，下次就能搜到了。</div>";
      return;
    }

    el.resHead.innerHTML = "<span>找到 <b>" + hits.length + "</b> 件物品"
      + (placeHits.length ? " · <b>" + placeHits.length + "</b> 个相关位置" : "") + "</span>";

    var html = hits.map(function (it) {
      var p = findPlace(it.placeId);
      var where = p ? ((p.room || "未指定") + " › " + p.name) : "位置已删除";
      return '<div class="res" data-item="' + esc(it.id) + '">'
        + '<span class="it-name">' + hi(it.name, q) + "</span>"
        + (Number(it.qty) > 1 ? '<span class="it-qty">×' + esc(it.qty) + "</span>" : "")
        + (it.tags ? '<span class="it-tag">' + hi(it.tags, q) + "</span>" : "")
        + '<span class="spacer"></span>'
        + '<span class="where">📍 <b>' + hi(where, q) + "</b></span>"
        + (p ? '<button class="gothere" data-act="goto" data-place="' + esc(p.id) + '">去看看</button>' : "")
        + '<button class="ic" data-act="copy" title="复制位置">⧉</button>'
        + "</div>";
    }).join("");

    if (!hits.length && placeHits.length) {
      html = '<div class="empty" style="margin-bottom:9px">没有物品名匹配，但下面这些位置命中了 —— 展开看看。</div>'
        + placeHits.map(renderPlaceCard).join("");
    } else if (placeHits.length && hits.length) {
      html += '<div class="res-head" style="margin-top:12px"><span>相关位置</span></div>'
        + placeHits.map(renderPlaceCard).join("");
    }

    el.results.innerHTML = html;
  }

  function renderItemRow(it) {
    if (state.editingItem === it.id) return renderItemEdit(it);
    var armed = state.armed === "item:" + it.id;
    return '<div class="it" data-item="' + esc(it.id) + '">'
      + '<span class="it-name">' + esc(it.name) + "</span>"
      + (Number(it.qty) > 1 ? '<span class="it-qty">×' + esc(it.qty) + "</span>" : "")
      + (it.tags ? '<span class="it-tag">' + esc(it.tags) + "</span>" : "")
      + (it.note ? '<span class="it-note" title="' + esc(it.note) + '">' + esc(it.note) + "</span>" : "")
      + '<span class="spacer"></span>'
      + '<span class="it-actions">'
      + '<button class="ic" data-act="edit-item" title="修改">✎</button>'
      + '<button class="ic danger' + (armed ? " armed" : "") + '" data-act="del-item" title="删除">'
      + (armed ? "✓" : "✕") + "</button>"
      + "</span></div>";
  }

  function renderItemEdit(it) {
    var opts = state.places.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === it.placeId ? " selected" : "") + ">"
        + esc((p.room || "未指定") + " › " + p.name) + "</option>";
    }).join("");
    return '<div class="it-edit" data-item="' + esc(it.id) + '">'
      + '<input class="w-name" value="' + esc(it.name || "") + '" placeholder="名称">'
      + '<input class="w-qty" value="' + esc(it.qty || 1) + '" placeholder="数量">'
      + '<input class="w-tag" value="' + esc(it.tags || "") + '" placeholder="标签">'
      + '<select class="w-place" title="换个地方放">' + opts + "</select>"
      + '<input class="w-note" value="' + esc(it.note || "") + '" placeholder="备注" style="flex:1 1 100%">'
      + '<div class="save-row">'
      + '<button class="ic" data-act="cancel-item">✕</button>'
      + '<button class="btn" data-act="save-item" style="padding:4px 12px;font-size:12px">保存</button>'
      + "</div></div>";
  }

  function renderPlaceCard(p) {
    var list = itemsOf(p.id).sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "zh"); });
    var collapsed = !!state.collapsed[p.id];
    var armed = state.armed === "place:" + p.id;

    var html = '<article class="place' + (state.flash === p.id ? " flash" : "") + '" data-place="' + esc(p.id) + '">'
      + '<div class="p-head">'
      + '<span class="p-icon">📦</span>'
      + '<span class="p-name" data-act="toggle">' + esc(p.name) + "</span>"
      + '<span class="p-count">' + list.length + " 件</span>"
      + '<button class="ic" data-act="toggle" title="' + (collapsed ? "展开" : "折叠") + '">' + (collapsed ? "▸" : "▾") + "</button>"
      + '<button class="ic danger' + (armed ? " armed" : "") + '" data-act="del-place" title="删除位置">'
      + (armed ? "✓" : "✕") + "</button>"
      + "</div>"
      + '<div class="p-note">' + esc(p.room || "未指定") + (p.note ? " · " + esc(p.note) : "") + "</div>";

    if (!collapsed) {
      html += '<div class="p-items">'
        + (list.length ? list.map(renderItemRow).join("") : '<div class="p-note" style="padding:2px 0">还没记东西</div>')
        + '<div class="addline">'
        + '<input data-place="' + esc(p.id) + '" placeholder="＋ 往里放东西…（回车，可粘多行；「毛衣 x3」可带数量）">'
        + "</div></div>";
    }

    html += "</article>";
    return html;
  }

  function renderBrowse() {
    var rs = rooms();
    if (!state.places.length) {
      el.rooms.innerHTML = '<div class="empty"><b>还没有记录任何位置</b>'
        + "点右上角「＋ 新建位置」，比如「换季衣物箱 / 储物间」。建好之后在卡片里连续往里放东西就行。</div>";
      return;
    }
    el.rooms.innerHTML = rs.map(function (r) {
      return '<div class="room-head"><h2>' + esc(r.name) + "</h2>"
        + '<span class="n">' + r.places.length + " 个位置 · " + r.count + " 件</span></div>"
        + '<div class="grid">' + r.places.map(renderPlaceCard).join("") + "</div>";
    }).join("");
  }

  function render() {
    renderStats();
    renderRoomList();
    renderSearch();
    renderBrowse();
    el.qClear.hidden = !state.q;
  }

  /* ───────── 动作 ───────── */

  function resetArm() {
    if (timerArm) { clearTimeout(timerArm); timerArm = null; }
    state.armed = null;
  }

  function addPlace() {
    var name = el.npName.value.trim();
    if (!name) { el.npName.focus(); return; }
    el.npSave.disabled = true;
    mutate("addPlace", {
      name: name,
      room: el.npRoom.value.trim() || "未指定",
      note: el.npNote.value.trim()
    }).then(function (p) {
      upsertPlace(p);
      el.npName.value = "";
      el.npNote.value = "";
      el.newplace.hidden = true;
      render();
      toast("success", "位置已建好", (p.room || "未指定") + " › " + p.name);
      var input = el.rooms.querySelector('[data-place="' + p.id + '"] .addline input');
      if (input) input.focus();
    }, function () {})
      .then(function () { el.npSave.disabled = false; });
  }

  function addItems(placeId, raw) {
    var lines = String(raw || "").split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) return Promise.resolve(0);
    var chain = Promise.resolve(0);
    lines.forEach(function (line) {
      /* 支持「名字 x3」/「名字 ×3」写法（要求分隔符前有空格，避免把 "iPhone 15" 误当数量） */
      var m = line.match(/^(.*?)\s+[×x*]\s*(\d+)$/);
      var payload = m
        ? { placeId: placeId, name: m[1].trim(), qty: Number(m[2]) }
        : { placeId: placeId, name: line, qty: 1 };
      if (!payload.name) return;
      chain = chain.then(function (n) {
        return mutate("addItem", payload).then(function (it) {
          upsertItem(it);
          return n + 1;
        }, function (e) {
          if (e && e.message === "no_sdk") throw e;
          return n;
        });
      });
    });
    return chain;
  }

  function removePlace(id) {
    var list = itemsOf(id);
    var place = findPlace(id);
    var chain = Promise.resolve();
    list.forEach(function (it) {
      chain = chain.then(function () {
        return mutate("removeItem", { id: it.id }).then(function () {
          state.items = state.items.filter(function (x) { return x.id !== it.id; });
        }, function () {});
      });
    });
    chain.then(function () {
      return mutate("removePlace", { id: id });
    }).then(function () {
      state.places = state.places.filter(function (x) { return x.id !== id; });
      render();
      toast("success", "位置已删除", (place ? place.name + " · " : "") + "连同其中 " + list.length + " 件物品记录");
    }, function () {});
  }

  function saveItem(card, it) {
    var name = card.querySelector(".w-name").value.trim();
    if (!name) { toast("warning", "名称不能为空"); return; }
    var qty = Math.max(1, parseInt(card.querySelector(".w-qty").value, 10) || 1);
    var tags = card.querySelector(".w-tag").value.trim();
    var note = card.querySelector(".w-note").value.trim();
    var placeId = card.querySelector(".w-place").value;

    mutate("updateItem", { id: it.id, name: name, qty: qty, tags: tags, note: note })
      .then(function (next) {
        upsertItem(next);
        if (placeId && placeId !== it.placeId) {
          return mutate("moveItem", { id: it.id, placeId: placeId }).then(function (moved) {
            upsertItem(moved);
            toast("success", "已换个地方放", name);
          }, function () {});
        }
        return null;
      })
      .then(function () { state.editingItem = null; render(); }, function () {});
  }

  /* ───────── 事件 ───────── */

  el.q.addEventListener("input", function () {
    state.q = el.q.value;
    renderSearch();
    el.qClear.hidden = !state.q;
  });

  el.q.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { el.q.value = ""; state.q = ""; render(); }
  });

  el.qClear.addEventListener("click", function () {
    el.q.value = "";
    state.q = "";
    render();
    el.q.focus();
  });

  el.newPlaceBtn.addEventListener("click", function () {
    el.newplace.hidden = !el.newplace.hidden;
    if (!el.newplace.hidden) el.npName.focus();
  });

  el.npCancel.addEventListener("click", function () {
    el.newplace.hidden = true;
  });

  el.npSave.addEventListener("click", addPlace);

  [el.npName, el.npRoom, el.npNote].forEach(function (input) {
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addPlace(); }
    });
  });

  function onAction(e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.dataset.act;

    /* 位置级 */
    var placeCard = btn.closest("[data-place]");
    if (placeCard && (act === "toggle" || act === "del-place")) {
      var pid = placeCard.dataset.place;
      if (act === "toggle") {
        state.collapsed[pid] = !state.collapsed[pid];
        render();
        return;
      }
      var n = itemsOf(pid).length;
      if (state.armed !== "place:" + pid) {
        state.armed = "place:" + pid;
        render();
        toast("warning", "再点一次确认删除", n ? "连同其中 " + n + " 件物品记录一起删掉" : placeCard.querySelector(".p-name").textContent);
        timerArm = setTimeout(function () { timerArm = null; state.armed = null; render(); }, 3200);
        return;
      }
      resetArm();
      removePlace(pid);
      return;
    }

    if (act === "goto") {
      var target = btn.dataset.place;
      state.q = "";
      el.q.value = "";
      state.collapsed[target] = false;
      state.flash = target;
      render();
      var node = el.rooms.querySelector('[data-place="' + target + '"]');
      if (node) node.scrollIntoView({ block: "center", behavior: "smooth" });
      if (timerFlash) clearTimeout(timerFlash);
      timerFlash = setTimeout(function () { timerFlash = null; state.flash = null; }, 1500);
      return;
    }

    /* 物品级 */
    var row = btn.closest("[data-item]");
    if (!row) return;
    var it = findItem(row.dataset.item);
    if (!it) return;

    if (act === "copy") {
      var p = findPlace(it.placeId);
      copyText(it.name + (Number(it.qty) > 1 ? " ×" + it.qty : "") + " —— "
        + (p ? (p.room || "未指定") + " › " + p.name : "位置已删除")).then(function (ok) {
        toast(ok ? "success" : "error", ok ? "已复制位置信息" : "复制失败");
      });
      return;
    }
    if (act === "edit-item") { state.editingItem = it.id; resetArm(); render(); return; }
    if (act === "cancel-item") { state.editingItem = null; render(); return; }
    if (act === "save-item") { saveItem(row, it); return; }
    if (act === "del-item") {
      if (state.armed !== "item:" + it.id) {
        state.armed = "item:" + it.id;
        render();
        timerArm = setTimeout(function () { timerArm = null; state.armed = null; render(); }, 3200);
        return;
      }
      resetArm();
      mutate("removeItem", { id: it.id }).then(function () {
        state.items = state.items.filter(function (x) { return x.id !== it.id; });
        render();
      }, function () {});
      return;
    }
  }

  el.rooms.addEventListener("click", onAction);
  el.results.addEventListener("click", onAction);

  /* 「＋ 往里放东西」：回车写入并保持焦点，可连续录 */
  function onKeydown(e) {
    var input = e.target;
    if (!input || input.tagName !== "INPUT") return;
    var host = input.closest(".addline");
    if (!host) return;
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    var pid = input.dataset.place;
    var value = input.value;
    if (!value.trim()) return;
    input.value = "";
    addItems(pid, value).then(function (n) {
      render();
      var again = document.querySelector('.addline input[data-place="' + pid + '"]');
      if (again) again.focus();
      if (n > 1) toast("success", "一次记了 " + n + " 件", "都在这个位置里");
    });
  }

  el.rooms.addEventListener("keydown", onKeydown);
  el.results.addEventListener("keydown", onKeydown);

  /* ───────── 启动 ───────── */

  function boot() {
    if (!SDK || !SDK.data) {
      el.rooms.innerHTML = '<div class="empty"><b>无法连接数据服务</b>'
        + "未检测到 Spherse 运行环境，请在 Spherse 中打开本页面。</div>";
      return;
    }

    refresh();

    if (SDK.events && SDK.events.on) {
      SDK.events.on("file:update", { path: DATA_FILE }, function () {
        if (state.editingItem) return;
        refresh();
      });
    }

    el.q.focus();
  }

  boot();
})();
</script>
</body>
</html>
